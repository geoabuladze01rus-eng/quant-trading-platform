name: CI

on:
  pull_request:
  push:
    branches: [main, harden/mvp-safety, 'feature/**', 'fix/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -c constraints-py311-linux.txt -e '.[dev]'
      - name: Secret hygiene
        run: python scripts/check_secret_hygiene.py
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall src tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, localhost health, teardown
        run: bash scripts/docker_smoke.sh
